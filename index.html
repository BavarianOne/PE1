<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="PE1 - Progressive Web App">
  <title>PE1</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PE1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: {
              500: '#6366f1',
              400: '#818cf8',
              600: '#4f46e5',
            },
            surface: {
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.6s ease-out forwards',
            'slide-up': 'slideUp 0.5s ease-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    * { box-sizing: border-box; }
    
    html { 
      font-size: 16px; 
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .bg-pattern {
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
        radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.1), transparent),
        radial-gradient(circle at 80% 20%, rgba(34, 211, 238, 0.08), transparent);
    }
    
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }
    
    .glow-accent {
      box-shadow: 0 0 30px -10px rgba(99, 102, 241, 0.4);
    }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    
    @supports (-webkit-touch-callout: none) {
      .min-h-screen { min-height: -webkit-fill-available; }
    }
  </style>
</head>
<body class="bg-pattern min-h-screen">
  <!-- Header / Nav -->
  <header class="sticky top-0 z-50 glass border-b border-white/5 px-4 py-3">
    <nav class="flex items-center justify-between gap-3 max-w-xl mx-auto" aria-label="Hauptnavigation">
      <a href="index.html" class="flex items-center gap-2 text-white font-semibold text-lg" aria-label="PE1 Startseite">
        <svg class="w-6 h-6 text-accent-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        PE1
      </a>
      
      <div class="flex items-center gap-1" role="navigation" aria-label="Seiten">
        <a href="index.html" class="nav-btn active px-3 py-2 rounded-xl text-sm font-medium text-white bg-accent-500/20" aria-current="page">
          <svg class="w-5 h-5 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span class="hidden sm:inline">Start</span>
        </a>
        <a href="compass.html" class="nav-btn px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 transition-colors">
          <svg class="w-5 h-5 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="12 2 15 8 12 8"/>
            <polygon points="12 22 15 16 12 16"/>
            <polygon points="2 12 8 15 8 12"/>
            <polygon points="22 12 16 15 16 12"/>
          </svg>
          <span class="hidden sm:inline">Kompass</span>
        </a>
        <a href="about.html" class="nav-btn px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 transition-colors">
          <svg class="w-5 h-5 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
          <span class="hidden sm:inline">Über</span>
        </a>
        <a href="contact.html" class="nav-btn px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 transition-colors">
          <svg class="w-5 h-5 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span class="hidden sm:inline">Kontakt</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="flex-1 px-4 py-3 md:py-5">
    <div class="max-w-xl mx-auto w-full">
      
      <!-- Compact Hero Section -->
      <section class="animate-fade-in" aria-labelledby="hero-title">
        <div class="glass rounded-2xl p-4 md:p-5 relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-br from-accent-500/10 via-transparent to-transparent" aria-hidden="true"></div>
          <div class="relative flex items-start gap-3">
            <div class="w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-gradient-to-br from-accent-500 to-accent-600 flex items-center justify-center flex-shrink-0 glow-accent" aria-hidden="true">
              <svg class="w-7 h-7 md:w-8 md:h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <h1 id="hero-title" class="text-xl md:text-2xl font-bold text-white tracking-tight leading-snug">PE1</h1>
              <p class="text-slate-300 text-sm md:text-base mt-1 leading-relaxed">Deine Progressive Web App — installierbar, offline-fähig, schnell.</p>
            </div>
          </div>
          
          <!-- Install Button -->
          <div class="mt-3 pt-3 border-t border-white/5">
            <button id="installBtn" class="btn-install w-full sm:w-auto px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-accent-500 to-accent-600 hidden opacity-0 transform translate-y-2 transition-all duration-300" aria-label="App installieren">
              <svg class="w-4 h-4 inline mr-1.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              App installieren
            </button>
          </div>
        </div>
      </section>

      <!-- Feature Cards - Immediately Visible -->
      <section class="mt-4 animate-slide-up" style="animation-delay: 0.1s;" aria-labelledby="features-title">
        <h2 id="features-title" class="sr-only">Features</h2>
        <div class="grid grid-cols-1 gap-3" role="list">
          
          <!-- Card 1: Kompass -->
          <a href="compass.html" class="feature-card group glass rounded-2xl p-4 relative overflow-hidden" role="listitem" aria-label="Kompass - Digitaler Kompass mit GPS & Kalibrierung">
            <div class="absolute inset-0 bg-gradient-to-br from-accent-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300" aria-hidden="true"></div>
            <div class="relative flex items-start gap-3">
              <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-accent-500 to-accent-600 flex items-center justify-center flex-shrink-0 group-hover:scale-105 transition-transform duration-300" aria-hidden="true">
                <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <polygon points="12 2 15 8 12 8"/>
                  <polygon points="12 22 15 16 12 16"/>
                  <polygon points="2 12 8 15 8 12"/>
                  <polygon points="22 12 16 15 16 12"/>
                </svg>
              </div>
              <div class="flex-1 min-w-0">
                <h3 class="font-semibold text-white text-base leading-tight">Kompass</h3>
                <p class="text-slate-400 text-sm mt-0.5 leading-relaxed">Digitaler Kompass mit GPS & Kalibrierung</p>
              </div>
              <svg class="w-5 h-5 text-slate-500 group-hover:text-accent-400 transition-colors flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 18l6-6-6-6"/>
              </svg>
            </div>
          </a>
          
          <!-- Card 2: Über -->
          <a href="about.html" class="feature-card group glass rounded-2xl p-4 relative overflow-hidden" role="listitem" aria-label="Über - Infos zur App, Technologien, Browser-Support" style="animation-delay: 0.15s;">
            <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300" aria-hidden="true"></div>
            <div class="relative flex items-start gap-3">
              <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-600 flex items-center justify-center flex-shrink-0 group-hover:scale-105 transition-transform duration-300" aria-hidden="true">
                <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M12 16v-4"/>
                  <path d="M12 8h.01"/>
                </svg>
              </div>
              <div class="flex-1 min-w-0">
                <h3 class="font-semibold text-white text-base leading-tight">Über</h3>
                <p class="text-slate-400 text-sm mt-0.5 leading-relaxed">Infos zur App, Technologien, Browser-Support</p>
              </div>
              <svg class="w-5 h-5 text-slate-500 group-hover:text-emerald-400 transition-colors flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 18l6-6-6-6"/>
              </svg>
            </div>
          </a>
          
          <!-- Card 3: Kontakt -->
          <a href="contact.html" class="feature-card group glass rounded-2xl p-4 relative overflow-hidden" role="listitem" aria-label="Kontakt - GitHub, Entwicklung, Lizenz" style="animation-delay: 0.2s;">
            <div class="absolute inset-0 bg-gradient-to-br from-amber-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300" aria-hidden="true"></div>
            <div class="relative flex items-start gap-3">
              <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 flex items-center justify-center flex-shrink-0 group-hover:scale-105 transition-transform duration-300" aria-hidden="true">
                <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
              </div>
              <div class="flex-1 min-w-0">
                <h3 class="font-semibold text-white text-base leading-tight">Kontakt</h3>
                <p class="text-slate-400 text-sm mt-0.5 leading-relaxed">GitHub, Entwicklung, Lizenz</p>
              </div>
              <svg class="w-5 h-5 text-slate-500 group-hover:text-amber-400 transition-colors flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 18l6-6-6-6"/>
              </svg>
            </div>
          </a>
          
        </div>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <footer class="px-4 py-4 border-t border-white/5">
    <div class="max-w-xl mx-auto text-center">
      <p class="text-slate-500 text-sm">&copy; 2026 PE1. <a href="https://github.com/BavarianOne/PE1" class="text-accent-400 hover:text-accent-300 transition-colors" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.error('SW registration failed:', err));
      });
    }

    // Install button logic handled by app.js
    // Active nav state handled by app.js
  </script>
</body>
</html>
